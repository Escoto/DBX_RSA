resources:
  catalogs:
    movies_analytics:
      name: ${var.catalog_name}
      comment: Catalog for Movies analytics.
      lifecycle:
        prevent_destroy: false # allow destroy on `bundle destroy`.
  schemas:
    movies:
      name: ${var.schema_name}
      catalog_name: ${resources.catalogs.movies_analytics.name}
  sql_warehouses:
    movies_analytics_warehouse:
      name: ${var.warehouse_name}
      cluster_size: 2X-Small
      enable_serverless_compute: true
      auto_stop_mins: 20
      max_num_clusters: 2
      min_num_clusters: 1
      warehouse_type: PRO
