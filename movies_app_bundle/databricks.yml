bundle:
  name: movies_app_bundle
  engine: direct

include:
  - resources/*.yml

variables:
  schedule:
    default: PAUSED

  # -- Lake Base --
  lakebase_instance_name:
    description: Lakebase instance name
    default: movies-app
  lakebase_catalog:
    description: Unity Catalog catalog name under which the Lakebase database is registered
    default: movies_app
  lakebase_database:
    description: Postgres database inside the instance that holds the app schema
    default: movies
  
  # -- Lake House --
  catalog_name:
    description: Unity Catalog catalog for Delta analytics tables and the seed job outputs
    default: movies_analytics
  schema_name:
    description: Schema (in var.catalog) for Delta analytics tables
    default: movies
  warehouse_name:
    description: Serverless SQL warehouse used for analytics queries
    default: movies_analytics

  # -- App --
  app_name:
    description: Databricks App name (lowercase letters, digits, hyphens)
    default: movies-app

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-66830d2c-97a4.cloud.databricks.com
      profile: movies
