[pytest]
# Run from movies_app/:  python -m pytest
#
# `pythonpath = .` makes `backend` and `tests` importable without installing the
# app or relying on pytest's rootdir insertion, so the suite behaves the same
# from an IDE, from CI, and from the Makefile.
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
