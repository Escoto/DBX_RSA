resources:
  apps:
    movies_app:
      name: ${var.app_name}-${bundle.target}
      description: "Movie ticket booking prototype — FastAPI + Vue on Lakebase"
      source_code_path: ../movies_app
      # Overrides movies_app/app.yaml's `env:` at deploy time. Bundle-variable
      # templated (resource attribute refs, not re-derived strings), so a
      # rename or a new target never requires hand-editing app.yaml. app.yaml
      # keeps only the static `command`.
      config:
        env:
          - name: LAKEBASE_INSTANCE
            value: ${resources.database_instances.movies_db.name}
          - name: LAKEBASE_DATABASE
            value: ${resources.database_catalogs.catalog_movies_db.database_name}
          - name: LAKEBASE_SCHEMA
            value: movies
          - name: PGHOST
            value_from: lakebase
      resources:
        - name: lakebase
          description: Lakebase OLTP database for the booking app
          database:
            instance_name: ${resources.database_instances.movies_db.name}
            database_name: ${var.lakebase_database}_${bundle.target}
            permission: CAN_CONNECT_AND_CREATE
