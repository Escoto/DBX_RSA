resources:
  database_instances:
    movies_db:
      name: ${var.lakebase_instance_name}
      capacity: CU_1 # smallest SKU; CU_2/CU_4/CU_8 for scale-up, readable secondaries for read scale-out
      stopped: true # true to stop / false to start (..keep running)
      lifecycle:
        prevent_destroy: false # allow destroy on `bundle destroy`.
  database_catalogs:
    catalog_movies_db:
      name: ${var.lakebase_catalog}
      database_instance_name: ${resources.database_instances.movies_db.name}
      database_name: ${var.lakebase_database}
      create_database_if_not_exists: true
